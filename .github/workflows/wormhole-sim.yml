name: Wormhole numerical simulation
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run numerical wormhole simulation
        run: python wormhole_sim.py --output-dir output --throat-radius 2 --r-max 10 --samples 180 --impact-parameter 1
      - name: Run chronology threshold model
        run: python chronology_model.py --output-dir output --beta 0.8 --duration-years 10 --separation-ly 1
      - name: Run semiclassical chronology audit
        run: python quantum_chronology.py --output-dir output --clock-offset-years 4 --separation-ly 1
      - name: Run stress-energy and energy-condition diagnostics
        run: python energy_conditions.py --output-dir output --throat-radius 2 --shape-exponent 1 --r-max 10 --samples 240
      - name: Trace photon ray bundle
        run: python photon_bundle.py --output-dir output --throat-radius 2 --r-max 10 --samples 100 --impacts 0,0.5,1,1.5
      - name: Analyze non-ultrastatic redshift profiles
        run: python redshifted_wormhole.py --output-dir output --throat-radius 2 --shape-exponent 1 --alpha 0.5 --scan=-2,-1,0,0.5,1,2 --r-max 10 --samples 240
      - name: Run version-4 research frontier audit
        run: python research_frontier.py --output-dir output
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: wormhole-results
          path: output/
          if-no-files-found: error
