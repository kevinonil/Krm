name: Wormhole geometry simulation

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run simulation
        run: python wormhole_sim.py --output-dir output --throat-radius 2 --r-max 10 --samples 180

      - name: Upload generated results
        uses: actions/upload-artifact@v4
        with:
          name: wormhole-results
          path: output/
          if-no-files-found: error
